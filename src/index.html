<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>کتابفروشی موریساکی | TheMorisakiBookshop</title>
  <meta name="description" content="کتابفروشی موریساکی، خانه‌ای برای کتاب‌های محبوب شما.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <style>
    /* Inline so it paints with the first byte, before any stylesheet. */
    body { margin: 0; background: #f5ead8; }
    .app-boot {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .app-boot-spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(32, 30, 29, 0.15);
      border-top-color: #c67139;
      border-radius: 50%;
      animation: app-boot-spin 0.8s linear infinite;
    }
    @keyframes app-boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .app-boot-spinner { animation-duration: 2s; }
    }
  </style>
  <!--
    Caprasimo, Figtree and Vazirmatn are self-hosted (see the @fontsource
    entries in angular.json). They used to come from fonts.googleapis.com,
    but that host is unreachable from Iran and the request hangs rather
    than failing fast: the browser kept the tab spinner turning long after
    the page was usable. Serving the woff2 from our own origin removes the
    third-party request entirely — nothing here depends on an outside host.
  -->
</head>
<body>
  <app-root>
    <!-- Shown until Angular boots, so a refresh never looks like a blank page. -->
    <div class="app-boot" aria-label="در حال بارگذاری">
      <div class="app-boot-spinner"></div>
    </div>
  </app-root>
</body>
</html>
