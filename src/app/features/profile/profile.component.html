<div class="page">
  <div class="layout">

    <aside class="sidebar">
      <div class="card elev-sm sidebar-card">
        <button
          type="button"
          class="avatar-btn"
          [class.locked]="!editing()"
          [disabled]="!editing()"
          (click)="avatarInput.click()"
          aria-label="تغییر تصویر پروفایل"
        >
          <img class="washed avatar" *ngIf="draft().avatar" [src]="draft().avatar" alt="تصویر پروفایل" />
          <span class="avatar avatar-empty" *ngIf="!draft().avatar">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
          </span>
          <span class="avatar-overlay">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
          </span>
        </button>
        <input
          #avatarInput
          type="file"
          accept="image/*"
          class="file-input"
          (change)="onAvatarSelected($event)"
        />
        <button
          type="button"
          class="btn btn-ghost remove-avatar"
          *ngIf="editing() && draft().avatar"
          (click)="removeAvatar()"
        >
          حذف تصویر
        </button>

        <h4>{{ draft().name || 'کاربر مهمان' }}</h4>
        <p class="card-body phone-text" *ngIf="draft().phone" dir="ltr">{{ draft().phone }}</p>

        <div class="hr"></div>

        <nav class="side-nav">
          <a class="nav-item active">اطلاعات حساب</a>
          <a class="nav-item" routerLink="/orders">سفارش‌های من</a>
          <a class="nav-item" routerLink="/liked">علاقه‌مندی‌ها</a>
          <a class="nav-item" routerLink="/addresses">آدرس‌ها</a>
          <button type="button" class="nav-item logout" (click)="logout()">خروج از حساب</button>
        </nav>
      </div>
    </aside>

    <div class="main-col">
      <div class="card elev-sm account-card">
        <h3>اطلاعات حساب کاربری</h3>
        <div class="hr"></div>

        <div class="fields-grid">
          <label class="field">
            <span>نام و نام خانوادگی</span>
            <input
              class="input"
              [readonly]="!editing()"
              [ngModel]="draft().name"
              (ngModelChange)="onField('name', $event)"
              name="name"
            />
          </label>

          <label class="field">
            <span>شماره موبایل</span>
            <input
              class="input ltr-field"
              type="tel"
              inputmode="tel"
              dir="ltr"
              placeholder="09123456789"
              [readonly]="!editing()"
              [ngModel]="draft().phone"
              (ngModelChange)="onField('phone', $event)"
              name="phone"
            />
          </label>

          <label class="field">
            <span>ایمیل</span>
            <input
              class="input ltr-field"
              type="email"
              inputmode="email"
              dir="ltr"
              placeholder="you@example.com"
              [readonly]="!editing()"
              [ngModel]="draft().email"
              (ngModelChange)="onField('email', $event)"
              name="email"
            />
          </label>

          <div class="field">
            <span>تاریخ تولد</span>
            <app-jalali-date-picker
              [readOnly]="!editing()"
              [ngModel]="draft().birthdate"
              (ngModelChange)="onField('birthdate', $event)"
              name="birthdate"
            ></app-jalali-date-picker>
          </div>
        </div>

        <div class="save-row">
          <button type="button" class="btn btn-primary" *ngIf="!editing()" (click)="startEdit()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
            اصلاح مشخصات
          </button>

          <ng-container *ngIf="editing()">
            <button type="button" class="btn btn-primary" (click)="save()">ذخیره تغییرات</button>
            <button type="button" class="btn btn-secondary" (click)="cancelEdit()">انصراف</button>
          </ng-container>
        </div>
      </div>

      <div class="card elev-sm orders-card">
        <div class="orders-head">
          <h3>آخرین سفارش‌ها</h3>
          <a routerLink="/orders" class="view-all" *ngIf="ordersService.count() > 0">مشاهده همه</a>
        </div>
        <div class="hr"></div>

        <p class="text-muted" *ngIf="ordersService.count() === 0">
          هنوز سفارشی ثبت نکرده‌اید.
        </p>

        <table class="table" *ngIf="ordersService.count() > 0">
          <tr *ngFor="let order of ordersService.recent()">
            <td dir="ltr" class="order-id">{{ order.id }}</td>
            <td dir="ltr">{{ order.date }}</td>
            <td>{{ order.itemsCount }} کالا</td>
            <td class="order-total">{{ order.total }} تومان</td>
            <td><span class="tag tag-accent-2">{{ order.status }}</span></td>
          </tr>
        </table>
      </div>
    </div>

  </div>
</div>
