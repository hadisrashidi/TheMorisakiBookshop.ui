<div class="container my-4">
  <h5 class="section-title">نتایج جستجو برای «{{ query }}»</h5>

  <div class="row g-3 my-3" *ngIf="!loading; else loadingTpl">
    <div class="col-6 col-md-3" *ngFor="let book of results">
      <div class="book-card" (click)="goToBookDetail(book.id)">
        <img [src]="book.image" [alt]="book.title" />
        <div class="book-card-body">
          <p class="book-card-title">{{ book.title }}</p>
        </div>
      </div>
    </div>

    <p class="text-muted" *ngIf="results.length === 0">کتابی با این مشخصات پیدا نشد.</p>
  </div>

  <ng-template #loadingTpl>
    <p class="text-muted">در حال جستجو...</p>
  </ng-template>
</div>
