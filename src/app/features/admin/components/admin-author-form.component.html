<div class="admin-page">
  <app-admin-nav />

  <div class="admin-head">
    <h2>{{ authorId === null ? 'افزودن نویسنده' : 'ویرایش نویسنده' }}</h2>
    <a class="btn btn-ghost" routerLink="/admin/authors">بازگشت به فهرست</a>
  </div>

  @if (loading()) {
    <p class="text-muted">در حال بارگذاری...</p>
  } @else {
    <form #authorForm="ngForm" class="card elev-sm" (ngSubmit)="save()">
      <div class="form-grid">
        <label class="field">
          <span>نام نویسنده</span>
          <input class="input" type="text" name="name" maxlength="100" required [(ngModel)]="model().name" />
        </label>

        <label class="field">
          <span>ژانر</span>
          <input class="input" type="text" name="genre" maxlength="50" [(ngModel)]="model().genre" />
        </label>

        <div class="field--wide">
          <app-admin-image-field label="تصویر نویسنده" folder="authors" [(value)]="model().image" />
        </div>

        <label class="field field--wide">
          <span>درباره‌ی نویسنده</span>
          <textarea class="textarea" name="bio" [(ngModel)]="model().bio"></textarea>
        </label>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="authorForm.invalid || saving()">
          {{ saving() ? 'در حال ذخیره...' : 'ذخیره' }}
        </button>
        <a class="btn btn-secondary" routerLink="/admin/authors">انصراف</a>
      </div>
    </form>
  }
</div>
