<div class="admin-page">
  <app-admin-nav />

  <div class="admin-head">
    <h2>مدیریت نویسندگان</h2>
    <a class="btn btn-primary" routerLink="/admin/authors/new">افزودن نویسنده</a>
  </div>

  <div class="card elev-sm">
    @if (loading()) {
      <p class="text-muted">در حال بارگذاری...</p>
    } @else if (authors().length === 0) {
      <p class="text-muted">نویسنده‌ای ثبت نشده است.</p>
    } @else {
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th></th>
              <th>نام</th>
              <th>ژانر</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            @for (author of authors(); track author.id) {
              <tr>
                <td><img class="washed thumb thumb--round" [src]="author.image | apiImage" [alt]="author.name" /></td>
                <td>{{ author.name }}</td>
                <td>{{ author.genre }}</td>
                <td>
                  <a class="btn btn-secondary" [routerLink]="['/admin/authors', author.id]">ویرایش</a>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    }
  </div>
</div>
