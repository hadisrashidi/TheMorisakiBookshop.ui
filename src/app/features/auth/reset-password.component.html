<div class="auth-page">
  <div class="card elev-md auth-card">
    <h2>فراموشی رمز عبور</h2>
    <p class="text-muted auth-intro">
      برای اطمینان از اینکه حساب مال شماست، یک کد پیامکی به موبایل حساب فرستاده می‌شود.
    </p>

    <form (ngSubmit)="submit()">
      <app-otp-request
        [(mobile)]="mobile"
        (codeSent)="onCodeSent()"
        (numberChanged)="onNumberChanged()"
      />

      @if (codeIsSent()) {
        <label class="field">
          <span>کد ارسال‌شده</span>
          <input
            class="input ltr-field code-input"
            type="text"
            dir="ltr"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            placeholder="------"
            [ngModel]="code()"
            (ngModelChange)="code.set($event)"
            name="code"
          />
        </label>

        <label class="field">
          <span>رمز عبور تازه</span>
          <input
            class="input ltr-field"
            type="password"
            dir="ltr"
            autocomplete="new-password"
            [ngModel]="newPassword()"
            (ngModelChange)="newPassword.set($event)"
            name="newPassword"
          />
        </label>

        <label class="field">
          <span>تکرار رمز عبور</span>
          <input
            class="input ltr-field"
            type="password"
            dir="ltr"
            autocomplete="new-password"
            [ngModel]="confirmPassword()"
            (ngModelChange)="confirmPassword.set($event)"
            name="confirmPassword"
          />
        </label>

        @if (error()) {
          <p class="error-note">{{ error() }}</p>
        }

        <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
          {{ submitting() ? 'در حال ذخیره...' : 'تعیین رمز تازه' }}
        </button>
      }
    </form>

    <p class="auth-switch"><a routerLink="/login">بازگشت به ورود</a></p>
  </div>
</div>
