<div class="auth-page">
  <div class="card elev-md auth-card">
    <h2>ساخت حساب</h2>
    <p class="text-muted auth-intro">با ثبت‌نام، سفارش‌ها و علاقه‌مندی‌هایتان را دنبال کنید.</p>

    <form (ngSubmit)="submit()">
      <label class="field">
        <span>نام و نام خانوادگی</span>
        <input
          class="input"
          autocomplete="name"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
          name="name"
        />
      </label>

      <label class="field">
        <span>ایمیل</span>
        <input
          class="input ltr-field"
          type="email"
          dir="ltr"
          autocomplete="email"
          placeholder="you@example.com"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
        />
      </label>

      <label class="field">
        <span>رمز عبور</span>
        <input
          class="input ltr-field"
          type="password"
          dir="ltr"
          autocomplete="new-password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
        />
      </label>

      <label class="field">
        <span>تکرار رمز عبور</span>
        <input
          class="input ltr-field"
          type="password"
          dir="ltr"
          autocomplete="new-password"
          [ngModel]="confirm()"
          (ngModelChange)="confirm.set($event)"
          name="confirm"
        />
      </label>

      <p class="error-note" *ngIf="error()">{{ error() }}</p>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
        {{ submitting() ? 'در حال ثبت‌نام...' : 'ثبت‌نام' }}
      </button>
    </form>

    <p class="auth-switch">
      قبلاً ثبت‌نام کرده‌اید؟
      <a routerLink="/login">وارد شوید</a>
    </p>
  </div>
</div>
