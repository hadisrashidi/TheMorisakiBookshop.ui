<div class="auth-page">
  <div class="card elev-md auth-card">
    <h2>ثبت‌نام</h2>
    <p class="text-muted auth-intro">
      شماره موبایل را با کد پیامکی تأیید کنید و ایمیل و رمز عبور خود را تعیین کنید.
    </p>

    <form (ngSubmit)="submit()">
      <app-otp-request
        [(mobile)]="mobile"
        (codeSent)="onCodeSent()"
        (numberChanged)="onNumberChanged()"
      />

      @if (codeIsSent()) {
        <label class="field">
          <span>کد ارسال‌شده</span>
          <input
            class="input ltr-field code-input"
            type="text"
            dir="ltr"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            placeholder="------"
            [ngModel]="code()"
            (ngModelChange)="code.set($event)"
            name="code"
          />
        </label>

        <label class="field">
          <span>ایمیل</span>
          <input
            class="input ltr-field"
            type="email"
            dir="ltr"
            autocomplete="email"
            placeholder="you@example.com"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
          />
        </label>

        <label class="field">
          <span>رمز عبور</span>
          <input
            class="input ltr-field"
            type="password"
            dir="ltr"
            autocomplete="new-password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
          />
        </label>

        <label class="field">
          <span>تکرار رمز عبور</span>
          <input
            class="input ltr-field"
            type="password"
            dir="ltr"
            autocomplete="new-password"
            [ngModel]="confirmPassword()"
            (ngModelChange)="confirmPassword.set($event)"
            name="confirmPassword"
          />
        </label>

        @if (error()) {
          <p class="error-note">{{ error() }}</p>
        }

        <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
          {{ submitting() ? 'در حال ثبت‌نام...' : 'ثبت‌نام' }}
        </button>
      }
    </form>

    <p class="auth-switch">
      قبلاً ثبت‌نام کرده‌اید؟
      <a routerLink="/login">وارد شوید</a>
    </p>
  </div>
</div>
