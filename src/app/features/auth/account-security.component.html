<div class="auth-page">
  <div class="card elev-md auth-card">
    <h2>ورود با ایمیل و رمز عبور</h2>
    <p class="text-muted auth-intro">
      @if (auth.current()?.hasPassword) {
        برای حساب شما ایمیل و رمز ثبت شده است. می‌توانید آن‌ها را تغییر دهید.
      } @else {
        اگر ایمیل و رمز ثبت کنید، دفعه‌های بعد بدون کد پیامکی هم می‌توانید وارد شوید.
      }
    </p>

    <form (ngSubmit)="submit()">
      <label class="field">
        <span>ایمیل</span>
        <input
          class="input ltr-field"
          type="email"
          dir="ltr"
          autocomplete="email"
          placeholder="you@example.com"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
        />
      </label>

      <label class="field">
        <span>رمز عبور</span>
        <input
          class="input ltr-field"
          type="password"
          dir="ltr"
          autocomplete="new-password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
        />
      </label>

      <label class="field">
        <span>تکرار رمز عبور</span>
        <input
          class="input ltr-field"
          type="password"
          dir="ltr"
          autocomplete="new-password"
          [ngModel]="confirmPassword()"
          (ngModelChange)="confirmPassword.set($event)"
          name="confirmPassword"
        />
      </label>

      @if (error()) {
        <p class="error-note">{{ error() }}</p>
      }

      <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
        {{ submitting() ? 'در حال ذخیره...' : 'ذخیره' }}
      </button>
    </form>

    <p class="auth-switch"><a routerLink="/profile">بازگشت به پروفایل</a></p>
  </div>
</div>
