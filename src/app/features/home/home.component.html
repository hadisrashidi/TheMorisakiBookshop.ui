<div class="page">

  <div class="section-head">
    <h2>پیشنهاد ویژه</h2>
    <a routerLink="/search" class="view-all">مشاهده همه</a>
  </div>
  <div class="featured-grid">
    <a
      class="card elev-sm"
      *ngFor="let book of featuredBooks"
      [routerLink]="['/books', book.id]"
    >
      <img class="washed cover" [src]="book.image" [alt]="book.title" />
      <p class="card-title">{{ book.title }}</p>
    </a>
  </div>

  <div class="section-head">
    <h2>جدیدترین کتاب‌ها</h2>
    <a routerLink="/search" class="view-all">مشاهده همه</a>
  </div>
  <div class="scroll-row">
    <div class="card elev-sm new-book" *ngFor="let book of newBooks">
      <a [routerLink]="['/books', book.id]">
        <img class="washed cover" [src]="book.image" [alt]="book.title" />
      </a>
      <p class="card-title">{{ book.title }}</p>
      <div class="new-book-foot">
        <span class="tag tag-accent-2">موجود</span>
        <button
          type="button"
          class="btn btn-icon btn-primary"
          [attr.aria-label]="'افزودن ' + book.title + ' به سبد خرید'"
          (click)="addToCart($event, book)"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"></circle><circle cx="19" cy="21" r="1"></circle><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 2-1.58l1.65-7.42H5.12"></path></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="section-head">
    <h2>نویسندگان</h2>
  </div>
  <div class="scroll-row authors">
    <div class="author" *ngFor="let author of authors">
      <img class="washed" [src]="author.image" [alt]="author.name" />
      <p>{{ author.name }}</p>
    </div>
  </div>

</div>
