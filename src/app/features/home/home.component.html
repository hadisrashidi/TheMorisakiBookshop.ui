<div class="container my-4">
  <h5 class="section-title">پیشنهاد ویژه</h5>

  <div class="row g-3 my-3">
    <div class="col-6 col-md-3" *ngFor="let book of featuredBooks">
      <div class="book-card" (click)="goToBookDetail(book.id)">
        <img [src]="book.image" [alt]="book.title" />
        <div class="book-card-body">
          <p class="book-card-title">{{ book.title }}</p>
        </div>
      </div>
    </div>
  </div>

  <h5 class="section-title">جدیدترین کتاب‌ها</h5>

  <div class="d-flex gap-3 overflow-auto my-3 pb-2">
    <div class="book-card flex-shrink-0" style="width: 160px" *ngFor="let book of newBooks" (click)="goToBookDetail(book.id)">
      <img [src]="book.image" [alt]="book.title" />
      <div class="book-card-body">
        <p class="book-card-title">{{ book.title }}</p>

        <div class="d-flex justify-content-between align-items-center">
          <span class="stock-available small">موجود</span>
          <button class="btn btn-sm btn-accent" (click)="$event.stopPropagation()">🛒</button>
        </div>
      </div>
    </div>
  </div>

  <h5 class="section-title">نویسندگان</h5>

  <div class="d-flex gap-3 overflow-auto my-3 pb-2">
    <div class="author-card flex-shrink-0" style="width: 140px" *ngFor="let author of authors">
      <img
        [src]="author.image"
        [alt]="author.name"
        class="rounded-circle mb-2"
        width="80"
        height="80"
      />
      <p class="small">{{ author.name }}</p>
    </div>
  </div>

</div>
