<div class="container my-4">
  <h5 class="section-title">پیشنهاد ویژه</h5>

  <div class="row my-3">
    <mat-card class="border-light-subtle m-5 p-4 text-center col-md-3" class="col-md-3" *ngFor="let book of featuredBooks"
    (click)="goToBookDetail(book.id)">
      <div class="card shadow-sm">
        <img [src]="book.image" class="card-img-top" />
        <div class="card-body text-center">
          <p>{{ book.title }}</p>
        </div>
      </div>
    </mat-card>
  </div>
  <h5 class="section-title">جدیدترین کتاب‌ها</h5>

  <div class="d-flex gap-3 overflow-auto my-3 pb-2">
    <mat-card class="border-light-subtle m-5 p-4 text-center" appearance="outlined" *ngFor="let book of newBooks">
      <img [src]="book.image" />

      <div class="p-2">
        <p class="small mb-1">{{ book.title }}</p>

        <div class="d-flex justify-content-between align-items-center">
          <span class="text-success small">موجود</span>
          <button class="btn btn-sm btn-warning">🛒</button>
        </div>
      </div>
    </mat-card>
  </div>
  <h5 class="section-title">نویسندگان</h5>

  <div class="d-flex gap-3 overflow-auto my-3">
    <mat-card class="border-light-subtle m-5 p-4 text-center" appearance="outlined" *ngFor="let author of authors">
      <img
        [src]="author.image"
        class="rounded-circle mb-2"
        width="80"
        height="80"
      />
      <p class="small">{{ author.name }}</p>
    </mat-card>
  </div>

</div>
