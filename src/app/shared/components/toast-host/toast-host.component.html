<div class="toast-stack" role="status" aria-live="polite">
  <div
    class="toast"
    *ngFor="let toast of toastService.toasts()"
    [class.success]="toast.type === 'success'"
    [class.error]="toast.type === 'error'"
    [class.warning]="toast.type === 'warning'"
    [class.info]="toast.type === 'info'"
  >
    <span class="toast-icon" [ngSwitch]="toast.type">
      <svg *ngSwitchCase="'success'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
      <svg *ngSwitchCase="'error'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15 9l-6 6M9 9l6 6"></path></svg>
      <svg *ngSwitchCase="'warning'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></svg>
      <svg *ngSwitchDefault width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4M12 8h.01"></path></svg>
    </span>

    <span class="toast-message">{{ toast.message }}</span>

    <button type="button" class="toast-close" (click)="toastService.dismiss(toast.id)" aria-label="بستن">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </button>
  </div>
</div>
