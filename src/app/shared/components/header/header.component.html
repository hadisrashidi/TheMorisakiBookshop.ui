<div class="bar">
  <a routerLink="/" class="brand">کتابفروشی موریساکی</a>

  <div class="search" *ngIf="showCategoryNav(); else spacer">
    <input
      type="text"
      class="input"
      placeholder="جستجو براساس عنوان, نام نویسنده, کلمات کلیدی"
      aria-label="جستجو براساس عنوان, نام نویسنده, کلمات کلیدی"
      [ngModel]="searchQuery"
      (ngModelChange)="onSearchInput($event)"
      (keyup.enter)="search()"
    />
    <button type="button" class="search-btn" (click)="search()" aria-label="جستجو">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
    </button>
  </div>
  <ng-template #spacer><div class="spacer"></div></ng-template>

  <div class="actions">
    <a
      *ngIf="!isLikedPage(); else likedActive"
      routerLink="/liked"
      class="btn btn-icon cart-btn"
      [attr.aria-label]="likedCount() > 0 ? 'علاقه‌مندی‌ها، ' + likedCount() + ' کتاب' : 'علاقه‌مندی‌ها'"
    >
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
      <span class="cart-badge" *ngIf="likedCount() > 0">{{ likedCount() }}</span>
    </a>
    <ng-template #likedActive>
      <button type="button" class="btn btn-icon cart-btn active" aria-label="علاقه‌مندی‌ها">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        <span class="cart-badge" *ngIf="likedCount() > 0">{{ likedCount() }}</span>
      </button>
    </ng-template>

    <a
      *ngIf="!isCartPage(); else cartActive"
      routerLink="/cart"
      class="btn btn-icon cart-btn"
      [attr.aria-label]="cartCount() > 0 ? 'سبد خرید، ' + cartCount() + ' کالا' : 'سبد خرید'"
    >
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"></circle><circle cx="19" cy="21" r="1"></circle><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 2-1.58l1.65-7.42H5.12"></path></svg>
      <span class="cart-badge" *ngIf="cartCount() > 0">{{ cartCount() }}</span>
    </a>
    <ng-template #cartActive>
      <button type="button" class="btn btn-icon cart-btn active" aria-label="سبد خرید">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"></circle><circle cx="19" cy="21" r="1"></circle><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 2-1.58l1.65-7.42H5.12"></path></svg>
        <span class="cart-badge" *ngIf="cartCount() > 0">{{ cartCount() }}</span>
      </button>
    </ng-template>

    <!-- Signed in: opens an account menu. Signed out: straight to login. -->
    <div class="account-wrap" *ngIf="auth.isLoggedIn(); else loginLink">
      <button
        type="button"
        class="btn btn-icon"
        [class.active]="isProfilePage() || accountMenuOpen()"
        (click)="toggleAccountMenu()"
        [attr.aria-expanded]="accountMenuOpen()"
        aria-haspopup="menu"
        aria-label="حساب کاربری"
      >
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
      </button>

      <div class="account-menu card elev-md" *ngIf="accountMenuOpen()" role="menu">
        <span class="account-name" *ngIf="auth.current()?.name">{{ auth.current()?.name }}</span>
        <a class="account-item" routerLink="/profile" role="menuitem" (click)="closeAccountMenu()">
          مشاهده پروفایل
        </a>
        <button type="button" class="account-item logout" role="menuitem" (click)="logout()">
          خروج از حساب
        </button>
      </div>
    </div>

    <ng-template #loginLink>
      <a routerLink="/login" class="btn btn-icon" aria-label="ورود به حساب">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
      </a>
    </ng-template>
  </div>
</div>

<nav class="subnav" aria-label="دسته‌بندی کتاب‌ها" *ngIf="showCategoryNav()">
  <a routerLink="/search" [queryParams]="{ q: 'رمان' }">رمان</a>
  <a routerLink="/search" [queryParams]="{ q: 'ادبیات داستانی' }">ادبیات داستانی</a>
  <a routerLink="/search" [queryParams]="{ q: 'کلاسیک' }">کلاسیک</a>
  <a routerLink="/search" [queryParams]="{ q: 'جنایی' }">جنایی</a>
  <a routerLink="/search" [queryParams]="{ q: 'داستان کوتاه' }">داستان کوتاه</a>
</nav>
