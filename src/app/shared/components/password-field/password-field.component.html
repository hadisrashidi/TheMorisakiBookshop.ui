<label class="field">
  <span>{{ label() }}</span>

  <span class="password-wrap">
    <input
      class="input ltr-field password-input"
      [type]="visible() ? 'text' : 'password'"
      dir="ltr"
      [attr.autocomplete]="autocomplete()"
      [ngModel]="value()"
      (ngModelChange)="value.set($event)"
      [attr.name]="name()"
      [ngModelOptions]="{ standalone: true }"
    />

    <button
      type="button"
      class="eye-button"
      [attr.aria-label]="visible() ? 'پنهان کردن رمز عبور' : 'نمایش رمز عبور'"
      [attr.aria-pressed]="visible()"
      (click)="toggleVisible()"
    >
      @if (visible()) {
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
      } @else {
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      }
    </button>
  </span>
</label>
