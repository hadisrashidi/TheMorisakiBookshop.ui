<div class="picker-wrap">
  <input
    class="input date-input"
    type="text"
    inputmode="numeric"
    placeholder="۱۳۷۲/۰۵/۱۲"
    dir="ltr"
    [value]="text()"
    (input)="onTextInput($any($event.target).value)"
    (focus)="open.set(true)"
  />
  <button type="button" class="calendar-btn" (click)="toggle()" aria-label="انتخاب تاریخ">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
  </button>

  <div class="calendar card elev-md" *ngIf="open()">
    <div class="cal-head">
      <button type="button" class="nav-btn" (click)="prevMonth()" aria-label="ماه قبل">‹</button>

      <div class="cal-selects">
        <select
          class="cal-select"
          aria-label="ماه"
          [value]="viewMonth()"
          (change)="setMonth($any($event.target).value)"
        >
          <option *ngFor="let m of months; let i = index" [value]="i + 1">{{ m }}</option>
        </select>

        <select
          class="cal-select"
          aria-label="سال"
          [value]="viewYear()"
          (change)="setYear($any($event.target).value)"
        >
          <option *ngFor="let y of years" [value]="y">{{ y }}</option>
        </select>
      </div>

      <button type="button" class="nav-btn" (click)="nextMonth()" aria-label="ماه بعد">›</button>
    </div>

    <div class="cal-grid weekdays">
      <span *ngFor="let w of weekdays">{{ w }}</span>
    </div>

    <div class="cal-grid days">
      <button
        type="button"
        *ngFor="let day of days()"
        class="day"
        [class.empty]="day === null"
        [class.selected]="isSelected(day)"
        [class.today]="isToday(day)"
        [disabled]="day === null"
        (click)="pick(day)"
      >{{ day }}</button>
    </div>

    <button type="button" class="today-btn" (click)="jumpToToday()">امروز</button>
  </div>
</div>
