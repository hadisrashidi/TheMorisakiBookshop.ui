<footer>
  <div class="cols">
    <div class="col">
      <h4>اطلاعات تماس</h4>
      <p>تهران، شریعتی</p>
      <p><a class="phone-link" [href]="'tel:' + phone" dir="ltr">{{ phone }}</a></p>
      <div class="social">
        <!-- Icon-only links: the accessible name lives on aria-label/title
             so screen readers and hover tooltips still say which is which. -->
        <a
          class="social-link"
          [href]="instagramUrl"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="اینستاگرام"
          title="اینستاگرام"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5.5"></rect>
            <circle cx="12" cy="12" r="4.2"></circle>
            <circle cx="17.6" cy="6.4" r="1.1" fill="currentColor" stroke="none"></circle>
          </svg>
        </a>

        <a
          class="social-link"
          [href]="telegramUrl"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="تلگرام"
          title="تلگرام"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M21.8 4.3 18.9 19c-.2 1-.8 1.2-1.6.75l-4.4-3.24-2.13 2.05c-.24.24-.44.44-.9.44l.32-4.5 8.2-7.4c.36-.32-.08-.5-.55-.18l-10.14 6.4-4.37-1.37c-.95-.3-.97-.95.2-1.4l17.1-6.6c.8-.28 1.5.19 1.24 1.35z"></path>
          </svg>
        </a>

        <a
          class="social-link"
          [href]="whatsappUrl"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="واتساپ"
          title="واتساپ"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12.04 2C6.6 2 2.18 6.42 2.18 11.86c0 1.74.46 3.44 1.32 4.94L2.1 22l5.34-1.4a9.83 9.83 0 0 0 4.6 1.16h.01c5.43 0 9.85-4.42 9.85-9.86A9.8 9.8 0 0 0 12.04 2zm0 17.9h-.01a8.2 8.2 0 0 1-4.16-1.14l-.3-.18-3.1.81.83-3.02-.2-.31a8.15 8.15 0 0 1-1.25-4.35c0-4.52 3.68-8.2 8.2-8.2a8.15 8.15 0 0 1 8.19 8.2c0 4.52-3.68 8.19-8.2 8.19zm4.5-6.14c-.25-.13-1.46-.72-1.68-.8-.23-.09-.4-.13-.56.12-.16.25-.64.8-.78.97-.15.16-.29.18-.53.06-.25-.13-1.04-.39-1.98-1.23-.73-.65-1.23-1.46-1.37-1.7-.15-.25-.02-.39.1-.51.11-.11.25-.29.37-.44.13-.15.17-.25.25-.41.09-.17.05-.31-.02-.44-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.41-.56-.42h-.47c-.16 0-.43.06-.65.31-.22.25-.85.84-.85 2.04 0 1.2.87 2.36.99 2.53.12.16 1.71 2.62 4.15 3.67.58.25 1.03.4 1.39.51.58.19 1.11.16 1.53.1.47-.07 1.46-.6 1.66-1.18.21-.58.21-1.07.14-1.18-.06-.11-.22-.17-.47-.29z"></path>
          </svg>
        </a>
      </div>
    </div>

    <div class="col">
      <h4>حساب کاربری</h4>
      <a routerLink="/profile" class="link">سفارش‌ها</a>
      <a routerLink="/profile" class="link">حساب کاربری من</a>
      <a routerLink="/search" class="link">محصولات</a>
      <a routerLink="/cart" class="link">پرداخت</a>
    </div>

    <div class="col">
      <h4>راهنمای خرید</h4>
      <a routerLink="/faq" class="link">سوالات متداول</a>
    </div>
  </div>

  <div class="bottom">
    کلیه حقوق برای این وب‌سایت محفوظ است
  </div>
</footer>
